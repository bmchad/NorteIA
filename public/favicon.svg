<!--
  O ícone da aba: os mesmos quadrados que marcam o produto na sidebar, no cabeçalho da
  landing e no hero — o `LayoutDashboard` do lucide-react, com a geometria copiada
  exatamente de `node_modules/lucide-react/dist/esm/icons/layout-dashboard.mjs`.

  Substitui o raio roxo que veio do andaime do projeto e nunca foi trocado.

  Preenchido, e não traçado como no app: a 16 px numa aba, o traço de 2 px do lucide vira
  1,3 px e as formas somem. Tile laranja sólido com quadrados brancos porque favicon precisa
  contrastar tanto em aba clara quanto escura.

  ⚠️ O `#FF6200` aqui é a ÚNICA duplicação legítima da cor de marca fora de `src/index.css`
  (D-037): arquivo em `public/` não enxerga variável CSS, e o navegador não passa cor
  nenhuma. Mudou `--marca`? Esta linha muda junto — não há como derivá-la.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#FF6200"/>
  <g transform="translate(4 4)" fill="#ffffff">
    <rect x="3" y="3" width="7" height="9" rx="1.5"/>
    <rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="12" width="7" height="9" rx="1.5"/>
    <rect x="3" y="16" width="7" height="5" rx="1.5"/>
  </g>
</svg>
